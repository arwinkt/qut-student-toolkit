name: Offline tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install documented browser and document dependencies
        run: python -m pip install playwright pdfplumber python-docx python-pptx openpyxl Pillow PyMuPDF pytesseract rapidocr-onnxruntime
      - name: Check installed dependencies
        run: python -m pip check
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Browser and path platform smoke (synthetic loopback only)
        run: python scripts/platform_smoke.py
      - name: Real local OCR smoke (synthetic PNG/PDF/DOCX/PPTX only)
        run: python scripts/ocr_smoke.py
      - name: Synthetic offline tests (no credentials or paid APIs)
        run: python -B -m unittest discover -s tests -v
      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests
      - name: Check patch whitespace
        run: git diff --check
